<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCR Training</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --border: #d9dee7;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --danger: #b91c1c;
      --warning: #a16207;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      padding: 0 12px;
    }

    button:hover {
      background: #f3f4f6;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-dark);
    }

    button.danger {
      color: var(--danger);
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      padding: 8px 10px;
      color: var(--text);
    }

    textarea {
      min-height: 74px;
      resize: vertical;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .app {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 360px;
      min-height: 100vh;
    }

    .sidebar,
    .inspector {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow: auto;
    }

    .inspector {
      border-right: 0;
      border-left: 1px solid var(--border);
    }

    .workspace {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 60px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      padding: 10px 14px;
      overflow-x: auto;
    }

    .canvas-wrap {
      position: relative;
      overflow: auto;
      padding: 24px;
    }

    .stage {
      position: relative;
      width: fit-content;
      margin: 0 auto;
      transform-origin: top center;
      box-shadow: var(--shadow);
    }

    #pageImage {
      display: block;
      max-width: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      cursor: crosshair;
    }

    .section {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .section-title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .upload-row,
    .action-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .doc-item,
    .annotation-item {
      display: grid;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
      text-align: left;
    }

    .doc-item.active,
    .annotation-item.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .item-title {
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill {
      border-radius: 999px;
      background: #eef2f7;
      color: #334155;
      padding: 2px 8px;
      font-size: 12px;
    }

    .pill.approved {
      background: #d1fae5;
      color: #065f46;
    }

    .pill.reviewed {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .pill.rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .pill.draft {
      background: #fef3c7;
      color: var(--warning);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--muted);
      padding: 18px;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 1100px) {
      .app {
        grid-template-columns: 240px minmax(0, 1fr);
      }

      .inspector {
        grid-column: 1 / -1;
        border-top: 1px solid var(--border);
        border-left: 0;
      }
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar,
      .inspector {
        border: 0;
        border-bottom: 1px solid var(--border);
      }

      .canvas-wrap {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <section class="section">
        <h1 class="section-title">OCR Training</h1>
        <form id="uploadForm" class="section">
          <label>
            Document Type
            <select id="documentTypeSelect">
              <option value="invoice">Invoice</option>
              <option value="payment_proof">Payment Proof</option>
            </select>
          </label>
          <input id="fileInput" type="file" accept=".pdf,image/*" required>
          <button class="primary" type="submit">Upload</button>
        </form>
        <button id="refreshButton" type="button">Refresh</button>
      </section>

      <section class="section">
        <div class="action-row">
          <h2 class="section-title">Queue</h2>
          <button id="exportButton" type="button">Export</button>
        </div>
        <div id="docList" class="list"></div>
      </section>
    </aside>

    <section class="workspace">
      <div class="toolbar">
        <button id="prevPage" type="button">Prev</button>
        <span id="pageInfo" class="muted">Page -</span>
        <button id="nextPage" type="button">Next</button>
        <button id="zoomOut" type="button">-</button>
        <span id="zoomInfo" class="muted">100%</span>
        <button id="zoomIn" type="button">+</button>
        <button id="fitWidth" type="button">Fit</button>
        <button id="autoSuggestButton" type="button">Auto Suggest</button>
        <span id="statusText" class="muted"></span>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <div id="emptyState" class="empty">Upload atau pilih dokumen untuk mulai annotation.</div>
        <div id="stage" class="stage hidden">
          <img id="pageImage" alt="Document page">
          <canvas id="overlay"></canvas>
        </div>
      </div>
    </section>

    <aside class="inspector">
      <section class="section">
        <h2 class="section-title">Bounding Box</h2>
        <div class="grid-2">
          <label>X <input id="bboxX" type="number" min="0" step="1"></label>
          <label>Y <input id="bboxY" type="number" min="0" step="1"></label>
          <label>Width <input id="bboxW" type="number" min="1" step="1"></label>
          <label>Height <input id="bboxH" type="number" min="1" step="1"></label>
        </div>
        <label>
          Label
          <select id="labelSelect">
            <option value="invoice_number">invoice_number</option>
            <option value="invoice_date">invoice_date</option>
            <option value="vendor_name">vendor_name</option>
            <option value="tax_number">tax_number</option>
            <option value="subtotal">subtotal</option>
            <option value="tax_amount">tax_amount</option>
            <option value="discount">discount</option>
            <option value="total_amount">total_amount</option>
            <option value="due_date">due_date</option>
            <option value="currency">currency</option>
            <option value="line_items">line_items</option>
          </select>
        </label>
        <label>
          Correct Text
          <textarea id="textInput" placeholder="OCR result or corrected value"></textarea>
        </label>
        <label>
          Status
          <select id="statusSelect">
            <option value="draft">draft</option>
            <option value="reviewed">reviewed</option>
            <option value="approved">approved</option>
            <option value="rejected">rejected</option>
          </select>
        </label>
        <div class="action-row">
          <button id="ocrCropButton" type="button">OCR Crop</button>
          <button id="saveAnnotationButton" class="primary" type="button">Save</button>
          <button id="deleteAnnotationButton" class="danger" type="button">Delete</button>
        </div>
      </section>

      <section class="section">
        <div class="action-row">
          <h2 class="section-title">Annotations</h2>
          <button id="approveDocumentButton" type="button">Approve Doc</button>
        </div>
        <div id="annotationList" class="list"></div>
      </section>
    </aside>
  </main>

  <script>
    const api = "/api/v1";
    const labelsByDocumentType = {
      invoice: [
        "invoice_number",
        "invoice_date",
        "vendor_name",
        "tax_number",
        "subtotal",
        "tax_amount",
        "discount",
        "total_amount",
        "due_date",
        "currency",
        "line_items"
      ],
      payment_proof: [
        "transfer_status",
        "amount",
        "currency",
        "transaction_date",
        "transaction_time",
        "source_bank",
        "source_account",
        "source_name",
        "destination_bank",
        "destination_account",
        "destination_name",
        "reference_number",
        "channel"
      ]
    };

    const state = {
      documents: [],
      currentDoc: null,
      documentType: "invoice",
      currentPage: 1,
      selectedAnnotationId: null,
      draftBox: null,
      zoom: 1,
      drawing: null
    };

    const els = {
      uploadForm: document.getElementById("uploadForm"),
      documentTypeSelect: document.getElementById("documentTypeSelect"),
      fileInput: document.getElementById("fileInput"),
      refreshButton: document.getElementById("refreshButton"),
      exportButton: document.getElementById("exportButton"),
      docList: document.getElementById("docList"),
      pageInfo: document.getElementById("pageInfo"),
      zoomInfo: document.getElementById("zoomInfo"),
      statusText: document.getElementById("statusText"),
      prevPage: document.getElementById("prevPage"),
      nextPage: document.getElementById("nextPage"),
      zoomOut: document.getElementById("zoomOut"),
      zoomIn: document.getElementById("zoomIn"),
      fitWidth: document.getElementById("fitWidth"),
      autoSuggestButton: document.getElementById("autoSuggestButton"),
      canvasWrap: document.getElementById("canvasWrap"),
      emptyState: document.getElementById("emptyState"),
      stage: document.getElementById("stage"),
      pageImage: document.getElementById("pageImage"),
      overlay: document.getElementById("overlay"),
      bboxX: document.getElementById("bboxX"),
      bboxY: document.getElementById("bboxY"),
      bboxW: document.getElementById("bboxW"),
      bboxH: document.getElementById("bboxH"),
      labelSelect: document.getElementById("labelSelect"),
      textInput: document.getElementById("textInput"),
      statusSelect: document.getElementById("statusSelect"),
      ocrCropButton: document.getElementById("ocrCropButton"),
      saveAnnotationButton: document.getElementById("saveAnnotationButton"),
      deleteAnnotationButton: document.getElementById("deleteAnnotationButton"),
      annotationList: document.getElementById("annotationList"),
      approveDocumentButton: document.getElementById("approveDocumentButton")
    };

    function setStatus(message) {
      els.statusText.textContent = message || "";
    }

    async function request(path, options = {}) {
      const res = await fetch(path, options);
      if (!res.ok) {
        const body = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(body.detail || res.statusText);
      }
      return res.json();
    }

    async function loadDocuments() {
      state.documents = await request(`${api}/training/documents?document_type=${state.documentType}`);
      renderDocuments();
    }

    async function loadDocument(invoiceId) {
      state.currentDoc = await request(`${api}/training/documents/${invoiceId}`);
      state.documentType = state.currentDoc.document_type || "invoice";
      els.documentTypeSelect.value = state.documentType;
      renderLabelOptions();
      state.currentPage = 1;
      state.selectedAnnotationId = null;
      state.draftBox = null;
      renderDocuments();
      renderCurrentPage();
      renderAnnotations();
      syncForm();
    }

    async function reloadCurrentDocument() {
      if (!state.currentDoc) return;
      const page = state.currentPage;
      const selected = state.selectedAnnotationId;
      state.currentDoc = await request(`${api}/training/documents/${state.currentDoc.id}`);
      state.documentType = state.currentDoc.document_type || "invoice";
      els.documentTypeSelect.value = state.documentType;
      renderLabelOptions();
      state.currentPage = Math.min(page, state.currentDoc.page_count);
      state.selectedAnnotationId = selected;
      if (!selectedAnnotation()) {
        state.selectedAnnotationId = null;
      }
      renderDocuments();
      renderCurrentPage();
      renderAnnotations();
      syncForm();
    }

    function renderDocuments() {
      if (!state.documents.length) {
        els.docList.innerHTML = `<div class="empty">Belum ada dokumen training.</div>`;
        return;
      }

      els.docList.innerHTML = state.documents.map(doc => `
        <button class="doc-item ${state.currentDoc?.id === doc.id ? "active" : ""}" data-doc-id="${doc.id}" type="button">
          <span class="item-title">${escapeHtml(doc.filename)}</span>
          <span class="muted">${doc.page_count} page | ${doc.annotation_count} boxes</span>
          <span class="pill-row">
            <span class="pill">${doc.document_type || "invoice"}</span>
            <span class="pill ${doc.status}">${doc.status}</span>
            <span class="pill">${doc.approved_annotation_count} approved</span>
          </span>
        </button>
      `).join("");

      els.docList.querySelectorAll("[data-doc-id]").forEach(button => {
        button.addEventListener("click", () => loadDocument(button.dataset.docId));
      });
    }

    function renderCurrentPage() {
      const doc = state.currentDoc;
      if (!doc) {
        els.emptyState.classList.remove("hidden");
        els.stage.classList.add("hidden");
        els.pageInfo.textContent = "Page -";
        return;
      }

      const page = doc.pages.find(item => item.page === state.currentPage);
      els.emptyState.classList.add("hidden");
      els.stage.classList.remove("hidden");
      els.pageInfo.textContent = `Page ${state.currentPage} / ${doc.page_count}`;
      els.pageImage.src = page.image_url;
      els.pageImage.onload = () => {
        els.overlay.width = page.width;
        els.overlay.height = page.height;
        els.stage.style.width = `${page.width}px`;
        els.stage.style.height = `${page.height}px`;
        applyZoom();
        drawOverlay();
      };
    }

    function applyZoom() {
      els.stage.style.transform = `scale(${state.zoom})`;
      els.zoomInfo.textContent = `${Math.round(state.zoom * 100)}%`;
      drawOverlay();
    }

    function renderAnnotations() {
      const annotations = visibleAnnotations();
      if (!annotations.length) {
        els.annotationList.innerHTML = `<div class="empty">Belum ada box di halaman ini.</div>`;
        return;
      }

      els.annotationList.innerHTML = annotations.map(annotation => `
        <button class="annotation-item ${state.selectedAnnotationId === annotation.id ? "active" : ""}" data-ann-id="${annotation.id}" type="button">
          <span class="item-title">${escapeHtml(annotation.label)}</span>
          <span class="muted">${escapeHtml(annotation.text || "-")}</span>
          <span class="pill-row">
            <span class="pill ${annotation.status}">${annotation.status}</span>
            <span class="pill">${Math.round((annotation.confidence || 0) * 100)}%</span>
          </span>
        </button>
      `).join("");

      els.annotationList.querySelectorAll("[data-ann-id]").forEach(button => {
        button.addEventListener("click", () => selectAnnotation(button.dataset.annId));
      });
    }

    function visibleAnnotations() {
      return (state.currentDoc?.annotations || []).filter(annotation => annotation.page === state.currentPage);
    }

    function selectedAnnotation() {
      return (state.currentDoc?.annotations || []).find(annotation => annotation.id === state.selectedAnnotationId) || null;
    }

    function renderLabelOptions() {
      const previous = els.labelSelect.value;
      const labels = labelsByDocumentType[state.documentType] || labelsByDocumentType.invoice;
      els.labelSelect.innerHTML = labels.map(label => `<option value="${label}">${label}</option>`).join("");
      els.labelSelect.value = labels.includes(previous) ? previous : labels[0];
    }

    function selectAnnotation(annotationId) {
      state.selectedAnnotationId = annotationId;
      const annotation = selectedAnnotation();
      state.draftBox = annotation ? { ...annotation.bbox } : null;
      syncForm();
      renderAnnotations();
      drawOverlay();
    }

    function syncForm() {
      const annotation = selectedAnnotation();
      const box = annotation?.bbox || state.draftBox || { x: 0, y: 0, width: 1, height: 1 };
      if (annotation?.label) {
        const labels = labelsByDocumentType[state.documentType] || [];
        if (!labels.includes(annotation.label)) {
          els.labelSelect.insertAdjacentHTML("beforeend", `<option value="${escapeHtml(annotation.label)}">${escapeHtml(annotation.label)}</option>`);
        }
      }
      els.bboxX.value = Math.round(box.x);
      els.bboxY.value = Math.round(box.y);
      els.bboxW.value = Math.round(box.width);
      els.bboxH.value = Math.round(box.height);
      els.labelSelect.value = annotation?.label || els.labelSelect.value;
      els.textInput.value = annotation?.text || "";
      els.statusSelect.value = annotation?.status || "draft";
    }

    function formBox() {
      return {
        x: Number(els.bboxX.value || 0),
        y: Number(els.bboxY.value || 0),
        width: Number(els.bboxW.value || 1),
        height: Number(els.bboxH.value || 1)
      };
    }

    function setDraftFromForm() {
      state.draftBox = formBox();
      drawOverlay();
    }

    function drawOverlay() {
      const ctx = els.overlay.getContext("2d");
      ctx.clearRect(0, 0, els.overlay.width, els.overlay.height);

      for (const annotation of visibleAnnotations()) {
        const selected = annotation.id === state.selectedAnnotationId;
        drawBox(ctx, annotation.bbox, selected ? "#0f766e" : "#2563eb", annotation.label);
      }

      if (state.draftBox && !state.selectedAnnotationId) {
        drawBox(ctx, state.draftBox, "#b45309", "draft");
      }
    }

    function drawBox(ctx, box, color, label) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.strokeRect(box.x, box.y, box.width, box.height);
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.92;
      const text = String(label || "");
      const labelWidth = Math.max(64, ctx.measureText(text).width + 16);
      ctx.fillRect(box.x, Math.max(0, box.y - 24), labelWidth, 24);
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#fff";
      ctx.font = "14px sans-serif";
      ctx.fillText(text, box.x + 8, Math.max(16, box.y - 7));
      ctx.restore();
    }

    function canvasPoint(event) {
      const rect = els.overlay.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) / state.zoom,
        y: (event.clientY - rect.top) / state.zoom
      };
    }

    async function saveAnnotation() {
      if (!state.currentDoc || !state.draftBox) return;
      const payload = {
        page: state.currentPage,
        label: els.labelSelect.value,
        bbox: formBox(),
        text: els.textInput.value || null,
        status: els.statusSelect.value,
        source: "manual"
      };

      if (state.selectedAnnotationId) {
        await request(`${api}/training/documents/${state.currentDoc.id}/annotations/${state.selectedAnnotationId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } else {
        const created = await request(`${api}/training/documents/${state.currentDoc.id}/annotations`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        state.selectedAnnotationId = created.id;
      }

      await loadDocument(state.currentDoc.id);
      setStatus("Saved");
    }

    async function ocrCrop() {
      if (!state.currentDoc || !state.draftBox) return;
      setStatus("Running OCR crop...");
      const result = await request(`${api}/training/documents/${state.currentDoc.id}/ocr-crop`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          page: state.currentPage,
          bbox: formBox(),
          engine: "auto"
        })
      });
      els.textInput.value = result.text;
      setStatus(`OCR ${Math.round(result.confidence * 100)}% via ${result.engine}`);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    els.uploadForm.addEventListener("submit", async event => {
      event.preventDefault();
      const file = els.fileInput.files[0];
      if (!file) return;
      const data = new FormData();
      data.append("file", file);
      setStatus("Uploading...");
      const doc = await request(`${api}/training/documents/${state.documentType}`, {
        method: "POST",
        body: data
      });
      els.fileInput.value = "";
      await loadDocuments();
      await loadDocument(doc.id);
      setStatus("Uploaded");
    });

    els.documentTypeSelect.addEventListener("change", async () => {
      state.documentType = els.documentTypeSelect.value;
      state.currentDoc = null;
      state.currentPage = 1;
      state.selectedAnnotationId = null;
      state.draftBox = null;
      renderLabelOptions();
      renderCurrentPage();
      renderAnnotations();
      await loadDocuments();
    });

    els.refreshButton.addEventListener("click", loadDocuments);
    els.exportButton.addEventListener("click", () => {
      window.open(`${api}/training/dataset/export?approved_only=true`, "_blank");
    });

    els.prevPage.addEventListener("click", () => {
      if (!state.currentDoc || state.currentPage <= 1) return;
      state.currentPage -= 1;
      state.selectedAnnotationId = null;
      state.draftBox = null;
      renderCurrentPage();
      renderAnnotations();
      syncForm();
    });

    els.nextPage.addEventListener("click", () => {
      if (!state.currentDoc || state.currentPage >= state.currentDoc.page_count) return;
      state.currentPage += 1;
      state.selectedAnnotationId = null;
      state.draftBox = null;
      renderCurrentPage();
      renderAnnotations();
      syncForm();
    });

    els.zoomIn.addEventListener("click", () => {
      state.zoom = Math.min(2.5, state.zoom + 0.1);
      applyZoom();
    });

    els.zoomOut.addEventListener("click", () => {
      state.zoom = Math.max(0.2, state.zoom - 0.1);
      applyZoom();
    });

    els.fitWidth.addEventListener("click", () => {
      const page = state.currentDoc?.pages.find(item => item.page === state.currentPage);
      if (!page) return;
      state.zoom = Math.max(0.2, Math.min(1.5, (els.canvasWrap.clientWidth - 64) / page.width));
      applyZoom();
    });

    els.autoSuggestButton.addEventListener("click", async () => {
      if (!state.currentDoc) return;
      try {
        setStatus("Running initial OCR...");
        const result = await request(`${api}/training/documents/${state.currentDoc.id}/auto-suggest`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            page: state.currentPage,
            replace_existing_auto: true
          })
        });
        await reloadCurrentDocument();
        setStatus(`Auto-suggest created ${result.created_count} boxes`);
      } catch (error) {
        setStatus(error.message);
      }
    });

    els.overlay.addEventListener("mousedown", event => {
      if (!state.currentDoc) return;
      const point = canvasPoint(event);
      state.selectedAnnotationId = null;
      state.drawing = { startX: point.x, startY: point.y };
      state.draftBox = { x: point.x, y: point.y, width: 1, height: 1 };
      syncForm();
      renderAnnotations();
      drawOverlay();
    });

    window.addEventListener("mousemove", event => {
      if (!state.drawing) return;
      const point = canvasPoint(event);
      const x = Math.min(state.drawing.startX, point.x);
      const y = Math.min(state.drawing.startY, point.y);
      const width = Math.abs(point.x - state.drawing.startX);
      const height = Math.abs(point.y - state.drawing.startY);
      state.draftBox = { x, y, width: Math.max(1, width), height: Math.max(1, height) };
      syncForm();
      drawOverlay();
    });

    window.addEventListener("mouseup", () => {
      state.drawing = null;
    });

    [els.bboxX, els.bboxY, els.bboxW, els.bboxH].forEach(input => {
      input.addEventListener("input", setDraftFromForm);
    });

    els.ocrCropButton.addEventListener("click", () => ocrCrop().catch(error => setStatus(error.message)));
    els.saveAnnotationButton.addEventListener("click", () => saveAnnotation().catch(error => setStatus(error.message)));

    els.deleteAnnotationButton.addEventListener("click", async () => {
      if (!state.currentDoc || !state.selectedAnnotationId) return;
      await request(`${api}/training/documents/${state.currentDoc.id}/annotations/${state.selectedAnnotationId}`, {
        method: "DELETE"
      });
      const invoiceId = state.currentDoc.id;
      state.selectedAnnotationId = null;
      state.draftBox = null;
      await loadDocument(invoiceId);
      setStatus("Deleted");
    });

    els.approveDocumentButton.addEventListener("click", async () => {
      if (!state.currentDoc) return;
      await request(`${api}/training/documents/${state.currentDoc.id}/status/approved`, {
        method: "PATCH"
      });
      await loadDocuments();
      await loadDocument(state.currentDoc.id);
      setStatus("Document approved");
    });

    renderLabelOptions();
    loadDocuments().catch(error => setStatus(error.message));
  </script>
</body>
</html>
